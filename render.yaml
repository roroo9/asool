# Render Blueprint: the Asool API (FastAPI). Render: New + -> Blueprint -> pick this repo.
services:
  - type: web
    name: asool-api
    runtime: python
    plan: starter         # always on during judging (owner decision, Oct 5)
    region: frankfurt
    buildCommand: pip install uv && uv sync --frozen --no-dev && (./scripts/fetch_references.sh || echo "KFGQPC download failed: Quranpedia fallback in use") && (uv run --no-dev python -m pipeline.quran_search || echo "Mushaf vectors not built: verse search uses word matching only")
    startCommand: uv run --no-dev uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: OPENROUTER_API_KEY
        sync: false        # paste in the Render dashboard; never committed
      - key: REVIEW_TOKEN
        sync: false        # the PRODUCTION code (REVIEW_TOKEN_PROD in .env), not the local one
      - key: CORS_ORIGINS
        sync: false        # the Vercel site URL, e.g. https://asool.vercel.app
      - key: DAILY_BUDGET_USD
        value: "3"
      - key: ANSWER_RATE_LIMIT_PER_HOUR
        value: "20"
